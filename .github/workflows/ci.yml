name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.6.0-devel-ubuntu24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y cmake git

      - name: Configure
        run: cmake -B build -DCMAKE_CUDA_ARCHITECTURES="75;80;86;89;90"

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/tests/test_*
          retention-days: 1

